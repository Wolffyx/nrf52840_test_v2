name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build NRF52840_TEST on nrf52840dk/nrf52840/zmk
    steps:
      # Checkout into ${GITHUB_WORKSPACE} root — this matches the upstream
      # zmk-config-template layout where the manifest dir (config/) is a
      # direct child of the workspace topdir.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          path: |
            modules/
            tools/
            zephyr/
            bootloader/
            zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West init
        run: west init -l config

      - name: West update
        run: west update

      - name: West zephyr-export
        run: west zephyr-export

      - name: Build
        run: |
          west build -s zmk/app -b "nrf52840dk/nrf52840/zmk" -- \
            -DSHIELD=NRF52840_TEST \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config"

      # Stage every produced firmware format. Build emits any of
      # zephyr.{hex,bin,uf2} or zmk.{hex,bin,uf2} depending on the
      # toolchain version — copy whichever exists.
      - name: Stage artifacts
        run: |
          set -eu
          mkdir -p artifacts
          base="nrf52840dk_nrf52840_zmk-NRF52840_TEST"
          for ext in hex bin uf2; do
            if [ -f "build/zephyr/zmk.${ext}" ]; then
              cp "build/zephyr/zmk.${ext}" "artifacts/${base}-zmk.${ext}"
            elif [ -f "build/zephyr/zephyr.${ext}" ]; then
              cp "build/zephyr/zephyr.${ext}" "artifacts/${base}-zmk.${ext}"
            fi
          done
          ls -lah artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/*
          if-no-files-found: error
