name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-build-arm:stable
    name: Build NRF52840_TEST on nrf52840dk/nrf52840/zmk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: config

      - name: Cache west modules
        uses: actions/cache@v4
        env:
          cache-name: cache-zephyr-modules
        with:
          # west init -l config/config places the workspace topdir
          # at config/, so .west and the fetched modules live there.
          path: |
            config/.west/
            config/modules/
            config/tools/
            config/zephyr/
            config/bootloader/
            config/zmk/
          key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('config/config/west.yml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ env.cache-name }}-
            ${{ runner.os }}-build-
            ${{ runner.os }}-

      - name: West init
        run: west init -l config/config

      - name: West update
        working-directory: config
        run: west update

      - name: West zephyr-export
        working-directory: config
        run: west zephyr-export

      - name: Build
        working-directory: config
        run: |
          west build -s zmk/app -b "nrf52840dk/nrf52840/zmk" -- \
            -DSHIELD=NRF52840_TEST \
            -DZMK_CONFIG="${GITHUB_WORKSPACE}/config/config" \
            -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config"

      # Rename per-format outputs so the artifact zip is unambiguous.
      # Build emits any of zephyr.{hex,bin,uf2} or zmk.{hex,bin,uf2}
      # depending on toolchain version — copy whichever exists.
      - name: Stage artifacts
        working-directory: config
        run: |
          set -eu
          mkdir -p ../artifacts
          base="nrf52840dk_nrf52840_zmk-NRF52840_TEST"
          for ext in hex bin uf2; do
            if [ -f "build/zephyr/zmk.${ext}" ]; then
              cp "build/zephyr/zmk.${ext}" "../artifacts/${base}-zmk.${ext}"
            elif [ -f "build/zephyr/zephyr.${ext}" ]; then
              cp "build/zephyr/zephyr.${ext}" "../artifacts/${base}-zmk.${ext}"
            fi
          done
          ls -lah ../artifacts/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: artifacts/*
          if-no-files-found: error
