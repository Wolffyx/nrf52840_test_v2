# Behavior-coverage test build for nrf52840-DK. Plug into the "nRF USB"
# port (device-side connector). DK enumerates as a HID keyboard over USB
# and (with BLE on) as a BLE peripheral.

# ── Transports ─────────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ── Behaviors that need feature flags ──────────────────────
# Pointing (&mkp / &mmv / &msc).
CONFIG_ZMK_POINTING=y

# ZMK Studio (&studio_unlock + live editing).
CONFIG_ZMK_STUDIO=y
# Studio over USB needs a CDC ACM endpoint (declared in the overlay as
# `studio_acm` and wired via `zmk,studio-rpc-uart`). Without these the
# firmware exposes only the HID keyboard interface and no COM port
# enumerates, so the Studio app cannot find the device.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
# Skip the unlock gate — Studio connects without &studio_unlock. Fine for
# a test/dev board; on a real keyboard you usually want this on (default).
CONFIG_ZMK_STUDIO_LOCKING=n

# Soft-off (&soft_off). Without a wakeup-source you'll need the DK's
# RESET button to come back; that's fine for proving the binding fires.
CONFIG_ZMK_PM_SOFT_OFF=y

# Backlight (&bl) — drives onboard LED1 (P0.13) via PWM. See overlay.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y

# RGB underglow (&rgb_ug) — drives an external WS2812 strip on P1.13
# (Arduino D11). Without a strip wired the build still succeeds; the
# behaviors just push pixel data into the void.
# In Zephyr 4.1+ the WS2812 / LED-strip / SPI drivers are auto-selected
# from the matching DT compatible nodes; only the ZMK toggle is needed.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Ext-power (&ext_power) — stubbed onto LED2 (P0.14) in the overlay.
# Toggles a LED when EP_TOG/EP_ON/EP_OFF fire so the behavior is visible.
CONFIG_ZMK_EXT_POWER=y

# ── Optional ───────────────────────────────────────────────
# Log over USB CDC ACM (open any serial monitor at 115200). Off by
# default — costs ~30KB flash and slows boot.
# CONFIG_ZMK_USB_LOGGING=y
