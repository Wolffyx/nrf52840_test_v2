# Behavior-coverage test build for a Pro Micro nRF52840 (promicro_nrf52840
# board — MASSDRIVER pinout / nice!nano-compatible footprint). Mirrors the
# feature set of the nrf52840-DK shield so ZMK Studio exposes every behavior;
# only the pin wiring (in the .overlay) differs. Flash the UF2 via the
# Adafruit nRF52 bootloader (double-tap RST to enter the drag-and-drop drive).

# ── Identity ───────────────────────────────────────────────
# Hard value (not a Kconfig.defconfig `default`, which can lose to a board
# variant default). ZMK Studio reports this via getDeviceInfo; keep it short
# (<=15 chars + null fits ZMK's name buffer).
CONFIG_ZMK_KEYBOARD_NAME="PM Test"

# ── Transports ─────────────────────────────────────────────
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y

# ── Persistence / settings storage ─────────────────────────
# THE FIX for ZMK Studio "Save" failing on this board. promicro_nrf52840 is a
# bare Zephyr board with no ZMK board defconfig, so it never enables the NVS
# settings backend that every ZMK board defconfig ships. CONFIG_ZMK_BLE only
# `imply SETTINGS` (no NVS/FLASH), so settings compiles in but no backend
# registers → settings_save_dst == NULL → settings_save_one() returns -ENOENT
# (-2), surfaced as "Failed to save selected physical layout (-2)". The board
# DTS already has a 32KB storage_partition; this just wires up the NVS backend
# to it. MPU_ALLOW_FLASH_WRITE is required because the board sets ARM_MPU=y,
# which otherwise faults on the NVS flash write. Mirrors ZMK's canonical set.
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y

# ── Behaviors that need feature flags ──────────────────────
# Pointing (&mkp / &mmv / &msc).
CONFIG_ZMK_POINTING=y

# ZMK Studio (&studio_unlock + live editing).
CONFIG_ZMK_STUDIO=y
# Studio over USB needs a CDC ACM endpoint (declared in the overlay as
# `studio_acm` and wired via `zmk,studio-rpc-uart`). Without these the
# firmware exposes only the HID keyboard interface and no COM port
# enumerates, so the Studio app cannot find the device.
CONFIG_SERIAL=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_CDC_ACM=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_ZMK_STUDIO_TRANSPORT_UART=y
# Skip the unlock gate — Studio connects without &studio_unlock. Fine for
# a test/dev board; on a real keyboard you usually want this on (default).
CONFIG_ZMK_STUDIO_LOCKING=n

# Soft-off (&soft_off). Without a wakeup-source you'll need the RST button
# to come back; that's fine for proving the binding fires.
CONFIG_ZMK_PM_SOFT_OFF=y

# Backlight (&bl) — drives the onboard LED (P0.15) via PWM. See overlay.
CONFIG_ZMK_BACKLIGHT=y
CONFIG_PWM=y

# RGB underglow (&rgb_ug) — drives an external WS2812 strip on the board's
# SPI2 MOSI (P1.02). Without a strip wired the build still succeeds; the
# behaviors just push pixel data into the void.
# In Zephyr 4.1+ the WS2812 / LED-strip / SPI drivers are auto-selected
# from the matching DT compatible nodes; only the ZMK toggle is needed.
CONFIG_ZMK_RGB_UNDERGLOW=y

# Ext-power (&ext_power) — stubbed onto a spare GPIO (P0.28) in the overlay.
# Toggles a pin when EP_TOG/EP_ON/EP_OFF fire so the behavior is visible and
# ZMK's RGB driver can resolve its hard ext_power dependency at build time.
CONFIG_ZMK_EXT_POWER=y

# ── Optional ───────────────────────────────────────────────
# Log over USB CDC ACM (open any serial monitor at 115200). Off by
# default — costs ~30KB flash and slows boot.
# NOTE: setting CONFIG_ZMK_USB_LOGGING=y here alone is NOT enough — it
# enables the console stack but leaves zephyr,console on the hardware UART
# pins, so nothing reaches the USB cable. Enable ZMK's `zmk-usb-logging`
# snippet instead (it also adds a 2nd CDC ACM wired to zephyr,console). The
# CI does this for the Pro Micro via -DSNIPPET in .github/workflows/build.yml.
# CONFIG_ZMK_USB_LOGGING=y
